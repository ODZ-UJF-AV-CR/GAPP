<div>
    @if(!isStation()) {
    <div class="font-semibold text-lg mb-1">{{ vehicle().name }}</div>
    }

    <div class="flex flex-col gap-2">
        @for(beacon of beacons(); track beacon.beacon.callsign) {
        <beacon-row [beacon]="beacon" [isStation]="isStation()"></beacon-row>
        }
    </div>
</div>
