<gapp-dialog #dialog title="Create new vehicle" [buttons]="dialogButtons">
    <form [formGroup]="form">
        <select-input formControlName="vehicle_type_id" label="Type" help="Vehicle type." [options]="vehicleTypes()"></select-input>
        <text-input formControlName="name" label="Callsign" help="Unique identification of vehicle."></text-input>
    </form>
</gapp-dialog>
